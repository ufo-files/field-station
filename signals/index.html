<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HackRF Live Waterfall</title>
<style>body{margin:0;background:#0b1220;color:#e4edf8;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:25px}p{color:#9dafc7}canvas{width:100%;display:block;background:#020615;border-radius:8px}#spectrum{height:160px;margin-bottom:12px}#waterfall{height:480px}.axis{display:flex;justify-content:space-between;margin:10px 0}label{margin-right:20px}input{width:80px}button{padding:8px 16px;background:#20344b;color:white;border:0;border-radius:6px}</style>
<main><h1>HackRF · Live waterfall</h1><label>Receiver <select id="receiver"><option value="narrow">1590–1610 MHz · 29427ec3</option><option value="wide">1–6000 MHz · 29283bc3</option></select></label><p id="status" role="status">Connecting…</p><div class="axis"><span id="low"></span><span id="center"></span><span id="high"></span></div><canvas id="spectrum" width="1000" height="160"></canvas><canvas id="waterfall" width="1000" height="480"></canvas><p>Newest measurements at the top · one row per second</p><label>Floor <input id="floor" type="number" value="-100"> dB</label><label>Ceiling <input id="ceiling" type="number" value="-40"> dB</label><button id="pause">Pause display</button><p>Both receivers continue logging independently. Power values are relative receiver measurements, not calibrated dBm.</p></main>
<script>
const $=id=>document.getElementById(id),wf=$('waterfall'),wc=wf.getContext('2d'),sp=$('spectrum'),sc=sp.getContext('2d');let last=0,paused=false;
$('receiver').onchange=()=>{last=0;wc.clearRect(0,0,wf.width,wf.height);poll()};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume display':'Pause display'};
function color(v){const t=Math.max(0,Math.min(1,v));const stops=[[2,6,21],[23,50,138],[0,191,208],[250,223,70],[255,65,35]];const i=Math.min(3,Math.floor(t*4)),f=t*4-i;return 'rgb('+stops[i].map((x,k)=>Math.round(x+(stops[i+1][k]-x)*f)).join(',')+')'}
async function poll(){try{const response=await fetch('/api/live?receiver='+$('receiver').value);if(!response.ok)throw Error('Waiting for receiver');const d=await response.json(),age=Date.now()/1000-d.timestamp;
$('status').textContent=(age>5?'STALE — ':'Live · ')+new Date(d.timestamp*1000).toLocaleTimeString()+' · '+d.sweep_rows+' sweep rows · noise floor '+d.noise_floor_db+' dB'+(paused?' · display paused':'');
const [lo,hi]=d.range_hz;$('low').textContent=(lo/1e6).toFixed(1)+' MHz';$('center').textContent=((lo+hi)/2e6).toFixed(1)+' MHz';$('high').textContent=(hi/1e6).toFixed(1)+' MHz';
if(paused||d.timestamp===last||age>5)return;last=d.timestamp;let floor=Number($('floor').value),ceiling=Number($('ceiling').value);if(ceiling<=floor)return;
wc.drawImage(wf,0,0,wf.width,wf.height-1,0,1,wf.width,wf.height-1);sc.clearRect(0,0,sp.width,sp.height);sc.strokeStyle='#55e3e8';sc.beginPath();const a=d.average_db;a.forEach((v,i)=>{const x=i*wf.width/a.length,w=Math.ceil(wf.width/a.length);wc.fillStyle=v===null?'#020615':color((v-floor)/(ceiling-floor));wc.fillRect(x,0,w,1);const y=sp.height*(1-Math.max(0,Math.min(1,(v-floor)/(ceiling-floor))));if(v===null){sc.stroke();sc.beginPath();return}sc.lineTo((i+.5)*sp.width/a.length,y)});sc.stroke();
}catch(e){$('status').textContent='Disconnected — '+e.message}finally{setTimeout(poll,1000)}}poll();
</script></html>
