[global]
    workgroup = WORKGROUP
    server string = Field Station SSD
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2_10
    server max protocol = SMB3
    smb encrypt = desired
    smb ports = 445
    vfs objects = fruit streams_xattr
    fruit:metadata = stream
    fruit:nfs_aces = no
    ea support = yes
    disable netbios = yes
    hosts allow = 127.0.0.1 ::1 192.168.8.0/24 100.64.0.0/10 fd7a:115c:a1e0::/48
    hosts deny = ALL
    usershare allow guests = no
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log file = /var/log/samba/log.%m
    max log size = 1000

[T7]
    comment = Field Station recordings and RF data
    path = /home/hackrf/t7
    valid users = hackrf
    read only = no
    create mask = 0660
    directory mask = 0770
    browseable = yes
    guest ok = no
    follow symlinks = no
    wide links = no
    veto files = /lost+found/
