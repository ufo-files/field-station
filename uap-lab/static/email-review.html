<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review station detection</title><link rel="stylesheet" href="/app-shell.css?v=5"><script src="/app-shell.js?v=7" defer></script>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#eff5f7;font:15px var(--app-font)}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}.hint{color:#b5c8d3;line-height:1.5}canvas{display:block;width:100%;height:auto;background:#000;touch-action:none;border:1px solid #526975;border-radius:8px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;padding:12px;border-radius:6px;border:1px solid #627e8c;background:#20333e;color:white}button:disabled{opacity:.5}#done{background:#ffdc00;color:#101820;font-weight:650}#save{background:#ffdc00;color:#101820;border-color:#ffdc00;font-weight:650}input[type=range]{flex:1;min-width:180px;accent-color:#ffdc00}.annotation{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #344b58}.annotation span{flex:1}.annotation button{padding:8px}#annotations{margin:12px 0 32px}#status{min-height:28px;line-height:1.5}.error{color:#ffb6aa}.review-stage{position:relative;line-height:0;background:#000;border-radius:8px;overflow:hidden}.review-stage video{display:block;width:100%;height:auto}.review-stage canvas{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;border-radius:0}.time{font-variant-numeric:tabular-nums}a{color:#9adff0}.trim-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}.trim-controls label{display:flex;align-items:center;gap:6px}.trim-controls input{width:7.5em;padding:8px;font:inherit;color:inherit;background:var(--panel,#20333e);border:1px solid var(--border,#627e8c);border-radius:4px}.trim-controls button,.trim-controls a{padding:8px;font-weight:400}#trim-status{min-height:1.4em}.video-tags{display:grid;gap:8px;margin:20px 0}.video-tags input{width:100%;padding:10px;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:4px}#automatic-tags{display:flex;gap:6px;flex-wrap:wrap}#automatic-tags span{border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:11px}#tags-status{font-size:12px}</style>
<main><p id="status" role="status">Loading the recorded video…</p><div id="editor"><p id="load-help" class="hint"><button id="load-video" type="button">Load video</button> If the video does not appear automatically, tap Load video.</p><div class="review-stage"><video id="video" muted playsinline preload="auto"></video><canvas id="frame" width="1920" height="1080" aria-label="Video frame. Drag to select the object."></canvas></div><div class="controls"><button id="play" disabled>Play</button><button id="prev" disabled aria-label="Previous frame">−1 frame</button><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Scrub video" disabled><button id="next" disabled aria-label="Next frame">+1 frame</button><span id="time" class="time">0.00 s</span></div><div class="trim-controls" role="group" aria-label="Trim recording"><label>Start <input id="trim-start" type="number" min="0" step="0.001" disabled aria-label="Trim start in seconds"></label><button id="trim-set-start" disabled>Set start here</button><label>End <input id="trim-end" type="number" min="0" step="0.001" disabled aria-label="Trim end in seconds"></label><button id="trim-set-end" disabled>Set end here</button><button id="trim-view-full" hidden>Show full video</button><button id="trim-preview" disabled>Preview trim</button><button id="trim-save" disabled>Save trim</button><button id="trim-reset" disabled>Restore full video</button><a id="trim-download" download="trimmed-video.mp4" hidden>Download trim</a><button id="bundle-download" disabled title="Available after the current Archive upload is verified">Download bundle</button></div><p id="trim-status" class="hint" role="status"></p><div class="video-tags"><label for="video-tags">Tags</label><div id="automatic-tags"></div><input id="video-tags" type="text" placeholder="Add custom tags, separated by commas" disabled aria-describedby="tags-status"><span id="tags-status" role="status"></span></div><div class="controls"><label>Object <select id="label" aria-label="Object label"></select></label><button id="new" disabled>New object</button><button id="reset" disabled>Original detection</button><button id="save" disabled>Add annotation</button></div><p class="hint" id="selection">Draw a box on the paused frame.</p><h2>Saved annotations <span id="count">0</span></h2><div id="annotations"></div></div></main><script src="/email-review.js?v=12"></script></html>
