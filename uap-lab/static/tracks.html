<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labeled objects</title><link rel="stylesheet" href="/style.css?v=24"><style>
body{padding-top:0}main{max-width:1500px;margin:auto;padding:24px}nav{margin-bottom:24px}.track-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}#trackVideo{max-width:100%;flex:1;min-width:180px}.category-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:16px 0}.category-tabs button{white-space:nowrap;background:transparent;border-color:var(--line);border-radius:24px}.category-tabs button[aria-pressed="true"]{background:#244039;border-color:var(--accent)}#observations{columns:260px;column-gap:18px}.track-observation{break-inside:avoid;display:inline-block;vertical-align:top;width:100%;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.track-observation:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.track-image{display:block;width:100%;padding:0;border:0;border-radius:0;background:#05090c}.track-image img{display:block;width:100%;height:auto;min-height:100px;object-fit:contain;max-height:420px;image-rendering:auto}.track-details{padding:14px;overflow-wrap:anywhere}.track-details label{display:flex;gap:10px;align-items:center;cursor:pointer}.track-details input{width:20px;height:20px;flex:none}.track-source{font-size:13px;color:var(--muted);margin:8px 0}.track-details a{font-size:14px}#trackMessage{min-height:2em}#linkTrack{margin:0 0 24px}#frameViewer{width:min(1200px,96vw);max-height:94dvh;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px}#frameViewer::backdrop{background:#000b}#nativeFrame{display:block;max-width:100%;max-height:72dvh;margin:auto;object-fit:contain}#closeFrame{float:right;margin-bottom:12px}#frameHeading{clear:both}@media(max-width:600px){main{padding:16px}.category-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:16px 0}.category-tabs button{white-space:nowrap;background:transparent;border-color:var(--line);border-radius:24px}.category-tabs button[aria-pressed="true"]{background:#244039;border-color:var(--accent)}#observations{columns:2;column-gap:10px}.track-observation{margin-bottom:10px}.track-details{padding:10px}.track-details label{font-size:14px}.track-source{font-size:12px}.track-image img{min-height:70px}}
.frame-stage{position:relative;width:fit-content;margin:auto;max-width:100%}#frameBox{position:absolute;border:3px solid #ffdc55;box-shadow:0 0 0 1px #111;pointer-events:none;box-sizing:border-box}.track-details button{margin:4px 4px 0 0}#trackSearch{max-width:100%;min-width:0}.danger{color:#ffaaaa}</style></head><body><main><nav aria-label="Navigation"><a href="/">Live and labeling</a> · <a href="/events">Recent events</a></nav><h1>Labeled objects</h1><p>Select an image to inspect its label, source, and review options.</p><div class="track-toolbar"><label for="trackVideo">Video</label><select id="trackVideo"><option value="">All videos · all tracks</option></select><label for="trackSearch">Search videos</label><input id="trackSearch" type="search" placeholder="Video name or ID"></div><div id="categoryTabs" class="category-tabs" role="group" aria-label="Filter observations by category"></div><p id="trackMessage" role="status" aria-live="polite">Loading saved observations…</p><div id="observations"></div><dialog id="frameViewer" aria-labelledby="frameHeading"><button id="closeFrame">Close frame</button><h2 id="frameHeading">Original frame</h2><p id="frameStatus" role="status"></p><div class="frame-stage"><img id="nativeFrame" alt="Original frame for the selected observation"><span id="frameBox" hidden></span></div><p id="frameDetails"></p><p id="selectionStatus" role="status"></p><div class="detail-actions"><a id="reviewLink" hidden>Open review video</a><button id="selectObservation">Select observation for linking</button><button id="linkTrack" disabled>Link selected observations and update model</button><button id="removeLabel" class="danger">Remove label</button></div></dialog><script src="/tracks.js?v=4"></script></main></body></html>
