<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review detections · Field Station</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/app-shell.css?v=10"><script src="/app-shell.js?v=12" defer></script><style>
main{max-width:1500px;margin:auto;padding:12px 24px}.queue-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px;font-size:13px}.queue-toolbar p{margin:0;color:var(--muted)}#detectionQueue{columns:260px;column-gap:0;line-height:0}.detection-card{position:relative;break-inside:avoid;display:block;overflow:hidden;margin:0;background:#05090c}.detection-image{display:block;width:100%;padding:0;border:0;border-radius:0;background:transparent}.detection-image img{display:block;width:100%;height:auto;aspect-ratio:auto 1 / 1;image-rendering:auto}.category-actions{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;background:linear-gradient(#10182033,#101820f5 45%);padding:10px;line-height:1.3;opacity:0;visibility:hidden;transition:opacity .12s;overflow:auto}.detection-card:hover .category-actions,.detection-card:focus-within .category-actions,.detection-card.controls-open .category-actions{opacity:1;visibility:visible}.category-grid{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.category-grid button{font:600 11px var(--app-font);padding:4px 3px;margin:0;border:1px solid #71878c;border-radius:4px;background:#15232ce8;color:#fff;min-height:28px;overflow-wrap:anywhere}.category-grid button:hover,.category-grid button:focus-visible{background:#315748;outline:2px solid #b8f4dd;outline-offset:0}.review-actions{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}.review-actions a,.review-actions button{flex:1;text-align:center;font:inherit;padding:4px 4px;background:#101820;color:#fff;border:1px solid #71878c;border-radius:4px;text-decoration:none}.queue-error{color:#ffb6aa;font-size:12px;line-height:1.4;margin:6px 0 0}.queue-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1001;background:#15232c;color:#fff;border:1px solid #71878c;border-radius:8px;padding:12px 16px;display:flex;gap:16px;align-items:center;max-width:94vw;line-height:1.4}.queue-toast[hidden]{display:none}#moreDetections{margin:16px 0}#queueFrame{width:min(1200px,96vw);background:#101820;color:#fff;border:1px solid #71878c;border-radius:8px;max-height:92dvh}#queueFrame img{max-width:100%;max-height:70dvh;object-fit:contain;display:block;margin:12px auto}#queueFrame::backdrop{background:#000b}.frame-actions{display:flex;justify-content:space-between;gap:16px;align-items:center}@media(max-width:600px){main{padding:8px 12px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.category-grid button{min-height:28px}.category-actions{justify-content:flex-start}.queue-toolbar{font-size:12px}#detectionQueue{columns:2}.category-actions{padding:6px}}@media(hover:none){.detection-card:hover:not(.controls-open):not(:focus-within) .category-actions{opacity:0;visibility:hidden}}
#queueFilters{display:flex;gap:8px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}#queueFilters::-webkit-scrollbar{display:none}#queueFilters a{font-size:13px;text-decoration:none;color:inherit;border-bottom:2px solid transparent;padding:2px 12px 1rem;white-space:nowrap}#queueFilters [aria-current="page"]{font-weight:700;border-bottom-color:var(--accent)}#detectionQueue{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),320px));gap:0;columns:auto}.detection-card{align-self:start}.detection-image{aspect-ratio:auto;width:100%;height:auto;overflow:hidden}.detection-image img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain}@media(max-width:600px){#detectionQueue{grid-template-columns:repeat(2,minmax(0,1fr));columns:auto}}.detection-card.selected{outline:3px solid var(--accent);outline-offset:-3px}.frame-select{position:absolute;right:8px;bottom:8px;z-index:2;width:22px;height:22px;cursor:pointer;accent-color:var(--accent)}.bulk-review{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);max-height:calc(100dvh - 120px);overflow:auto;z-index:1001;border-radius:8px;box-shadow:0 8px 32px #0005;display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px;background:var(--bg,#101820);color:var(--text,inherit);border:1px solid var(--accent);line-height:1.4}.bulk-review[hidden]{display:none}main:has(.bulk-review:not([hidden])){padding-bottom:calc(var(--bulk-review-height,180px) + 32px)}#bulkCategories{display:flex;gap:8px;flex-wrap:wrap}.selection-help{font-size:12px;color:var(--muted)}.detection-card{user-select:none}
#queueToast{pointer-events:none}#objectViews{display:flex;overflow-x:auto;gap:8px;margin-bottom:12px}#objectViews button{white-space:nowrap;background:transparent;color:inherit;border:0;border-bottom:2px solid transparent;border-radius:0}#objectViews button[aria-pressed="true"]{border-bottom-color:var(--accent);font-weight:700}.object-label{position:absolute;top:0;left:0;padding:6px 8px;background:var(--panel);color:var(--ink);font-size:11px;line-height:1.3;pointer-events:none}.category-actions{padding-top:42px}</style></head><body><main><p id="queueStatus" hidden></p><nav id="objectViews" class="category-tabs" aria-label="Detection views"></nav><div id="bulkReview" class="bulk-review" role="region" aria-label="Classify selected frames" hidden><span id="selectionCount" role="status"></span><div id="bulkCategories"></div><button id="selectAll" type="button">Select all loaded</button><button id="clearSelection" type="button">Clear selection</button></div><div id="detectionQueue"></div><button id="moreDetections" hidden>Load 100 more</button><p id="queueEmpty" hidden>No objects in this view.</p></main><div id="queueToast" class="queue-toast" role="status" hidden><span id="queueSaved"></span></div><dialog id="queueFrame" aria-label="Detected object in original frame"><div class="frame-actions"><a id="queueVideoLink">Review video</a><button id="closeQueueFrame">Close</button></div><div id="queueFrameStage" style="position:relative"><img id="queueFullFrame" alt="Original frame with the detected object boxed"><span id="queueFrameBox" hidden style="position:absolute;border:3px solid #ffdc55;box-sizing:border-box;pointer-events:none"></span></div><p>Choose a category on the card to save its label. Open the video to scrub, redraw boxes, or review additional objects.</p></dialog><script src="/detections.js?v=10"></script></body></html>
