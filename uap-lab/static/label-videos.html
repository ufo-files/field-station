<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Label videos · Field Station</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/app-shell.css?v=4"><script src="/app-shell.js?v=4" defer></script><style>
main{max-width:1500px;margin:auto;padding:12px 24px}.queue-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px;font-size:14px}.queue-toolbar p{margin:0;color:var(--muted)}#detectionQueue{columns:260px;column-gap:0;line-height:0}.detection-card{position:relative;break-inside:avoid;display:block;overflow:hidden;margin:0;background:#05090c}.detection-image{display:block;width:100%;padding:0;border:0;border-radius:0;background:transparent}.detection-image img{display:block;width:100%;height:auto;aspect-ratio:auto 1 / 1;image-rendering:auto}.category-actions{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;background:linear-gradient(#10182033,#101820f5 45%);padding:10px;line-height:1.3;opacity:0;visibility:hidden;transition:opacity .12s;overflow:auto}.detection-card:hover .category-actions,.detection-card:focus-within .category-actions,.detection-card.controls-open .category-actions{opacity:1;visibility:visible}.category-grid{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.category-grid button{font:600 12px system-ui;padding:8px 3px;margin:0;border:1px solid #71878c;border-radius:4px;background:#15232ce8;color:#fff;min-height:36px;overflow-wrap:anywhere}.category-grid button:hover,.category-grid button:focus-visible{background:#315748;outline:2px solid #b8f4dd;outline-offset:0}.review-actions{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}.review-actions a,.review-actions button{flex:1;text-align:center;font:inherit;padding:8px 4px;background:#101820;color:#fff;border:1px solid #71878c;border-radius:4px;text-decoration:none}.queue-error{color:#ffb6aa;font-size:13px;line-height:1.4;margin:6px 0 0}.queue-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1001;background:#15232c;color:#fff;border:1px solid #71878c;border-radius:8px;padding:12px 16px;display:flex;gap:16px;align-items:center;max-width:94vw;line-height:1.4}.queue-toast[hidden]{display:none}#moreDetections{margin:16px 0}#queueFrame{width:min(1200px,96vw);background:#101820;color:#fff;border:1px solid #71878c;border-radius:8px;max-height:92dvh}#queueFrame img{max-width:100%;max-height:70dvh;object-fit:contain;display:block;margin:12px auto}#queueFrame::backdrop{background:#000b}.frame-actions{display:flex;justify-content:space-between;gap:16px;align-items:center}@media(max-width:600px){main{padding:8px 12px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.category-grid button{min-height:40px}.category-actions{justify-content:flex-start}.queue-toolbar{font-size:13px}#detectionQueue{columns:2}.category-actions{padding:6px}}@media(hover:none){.detection-card:hover:not(.controls-open):not(:focus-within) .category-actions{opacity:0;visibility:hidden}}
#queueFilters{display:flex;gap:8px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}#queueFilters::-webkit-scrollbar{display:none}#queueFilters a{font-size:14px;text-decoration:none;color:inherit;border-bottom:2px solid transparent;padding:2px 12px 1rem;white-space:nowrap}#queueFilters [aria-current="page"]{font-weight:700;border-bottom-color:var(--accent)}</style></head><body><main><nav id="queueFilters" aria-label="Review queue"><a href="/label-videos" data-source="all">All</a><a href="/label-videos?source=detections" data-source="detections">Detections</a><a href="/label-videos?source=videos" data-source="videos">Videos</a></nav><div class="queue-toolbar"><p id="queueStatus" role="status">Loading detected frames…</p><a href="/?view=label">Manual video review</a></div><div id="detectionQueue"></div><button id="moreDetections" hidden>Load 100 more</button><p id="queueEmpty" hidden>You’re caught up. New detections and videos will appear here.</p></main><div id="queueToast" class="queue-toast" role="status" hidden><span id="queueSaved"></span><button id="undoLabel">Undo</button></div><dialog id="queueFrame" aria-label="Detected object in original frame"><div class="frame-actions"><a id="queueVideoLink">Review video</a><button id="closeQueueFrame">Close</button></div><img id="queueFullFrame" alt="Original frame with the detected object boxed"><p>Choose a category on the card to save its label. Open the video to scrub, redraw boxes, or review additional objects.</p></dialog><script src="/label-videos.js?v=5"></script></body></html>
