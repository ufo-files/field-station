<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test model · Field Station</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/app-shell.css"><script src="/app-shell.js" defer></script><script src="/model-tests.js" defer></script><style>
body:has(.model-tests){height:100dvh;overflow:hidden}main.model-tests{width:100%;max-width:none;height:calc(100dvh - 64px);margin:0;padding:0;display:flex;flex-direction:column}.model-tests h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.model-table-scroll{flex:1;min-height:0;overflow:auto}#modelTable{width:100%;min-width:1000px;border-collapse:separate;border-spacing:0;text-align:left;font-size:14px}#modelTable th{position:sticky;top:0;z-index:2;background:var(--panel);font-weight:600;box-shadow:0 1px 0 var(--line)}#modelTable th,#modelTable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;font-variant-numeric:tabular-nums}#modelTable tbody tr:hover{background:var(--panel)}#modelTable td:last-child{text-align:right}#modelTable th:last-child{text-align:right}#modelTable td.test-state{white-space:normal;min-width:180px;max-width:330px}#modelTable button{margin:0;padding:4px 10px;font:12px/1.2 system-ui;min-height:0;border-radius:5px}#benchmarkSummary{flex:none;margin:0;padding:12px 14px;font-size:13px;border-top:1px solid var(--line)}@media(max-width:600px){#modelTable th,#modelTable td{padding:10px}}
